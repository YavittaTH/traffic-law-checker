<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทำแบบนี้ผิดอะไรบ้าง?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f1e; --muted: #6b6f6c; --line: #e2e0d9;
  --accent: #b5401b; --accent-soft: #fbe9e2; --ok: #2f6b45; --ok-soft: #e3f1e8;
  --warn: #8a6100; --warn-soft: #fbf0d6; --info: #2d5486; --info-soft: #e3ecf7;
  --code: #f1efe9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161716; --panel: #1f2120; --ink: #ecebe6; --muted: #9b9f9b; --line: #323432;
    --accent: #ef7b54; --accent-soft: #3a231b; --ok: #7cc597; --ok-soft: #1d3326;
    --warn: #e7bd5c; --warn-soft: #362c14; --info: #8fb5e8; --info-soft: #1b2738; --code: #262826;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 "IBM Plex Sans Thai", system-ui, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.01em; }
.lede { color: var(--muted); margin: 0 0 24px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font: inherit; background: var(--bg); color: var(--ink); }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; font: inherit;
  font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.go { margin-left: auto; border: 0; background: var(--accent); color: #fff; border-radius: 8px;
  padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
.go:disabled { opacity: .5; cursor: wait; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.examples button { border: 1px dashed var(--line); background: transparent; color: var(--muted);
  border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.examples button:hover { color: var(--ink); border-color: var(--muted); }
.modehint { font-size: 13px; color: var(--muted); margin-top: 8px; }
section { margin-top: 20px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 0 0 8px; font-weight: 600; }
.src { display: grid; grid-template-columns: 36px 1fr auto; gap: 4px 10px; padding: 8px 0;
  border-top: 1px solid var(--line); font-size: 14px; }
.src:first-child { border-top: 0; }
.src .n { font-family: "IBM Plex Mono", monospace; color: var(--accent); font-weight: 600; }
.src .sc { font-family: "IBM Plex Mono", monospace; color: var(--muted); font-size: 12px; }
.src .sub { grid-column: 2 / 4; color: var(--muted); font-size: 13px; }
.src.cited { background: var(--accent-soft); margin: 0 -16px; padding: 8px 16px; }
pre.stream { background: var(--code); border-radius: 8px; padding: 10px 12px; margin: 0; white-space: pre-wrap;
  font: 12.5px/1.5 "IBM Plex Mono", monospace; color: var(--muted); max-height: 220px; overflow: auto; }
.step { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.step code { font-family: "IBM Plex Mono", monospace; background: var(--code); padding: 1px 5px; border-radius: 4px; }
.badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.b-violations_found { background: var(--accent-soft); color: var(--accent); }
.b-no_violation { background: var(--ok-soft); color: var(--ok); }
.b-need_more_info { background: var(--warn-soft); color: var(--warn); }
.b-out_of_scope { background: var(--info-soft); color: var(--info); }
.summary { font-size: 18px; margin: 10px 0 4px; }
.viol { border-top: 1px solid var(--line); padding: 12px 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.viol .t { font-weight: 600; }
.viol .cite { color: var(--muted); font-size: 13px; }
.viol .why { grid-column: 1 / 3; font-size: 14px; }
.viol .pen { text-align: right; font-size: 14px; white-space: nowrap; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.tile { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin-top: 10px; }
.ask { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
.err { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 10px 12px; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>ทำแบบนี้ผิดอะไรบ้าง?</h1>
  <p class="lede">เล่าเรื่องที่เกิดบนถนนด้วยภาษาพูดได้เลย ระบบจะหาว่าผิดข้อหาไหน อ้างมาตรา และคำนวณค่าปรับสูงสุดกับแต้มที่ถูกตัด (ครอบคลุม 22 ข้อหาที่ตัดคะแนนความประพฤติ)</p>

  <div class="panel">
    <textarea id="story" placeholder="เช่น ขี่มอไซค์ซ้อนแฟน ไม่ใส่หมวกทั้งคู่ แล้วฝ่าไฟแดง"></textarea>
    <div class="examples" id="examples"></div>
    <div class="row">
      <div class="seg" role="group" aria-label="โหมด">
        <button data-mode="rag" aria-pressed="true">RAG</button>
        <button data-mode="agent" aria-pressed="false">Agentic RAG</button>
        <button data-mode="baseline" aria-pressed="false">LLM อย่างเดียว</button>
      </div>
      <button class="go" id="go">ตรวจ</button>
    </div>
    <div class="modehint" id="modehint"></div>
  </div>

  <section id="s-sources" class="hidden"><h2>แหล่งข้อมูลที่ค้นเจอ (ส่งให้โมเดลแบบมีหมายเลข)</h2><div class="panel" id="sources"></div></section>
  <section id="s-steps" class="hidden"><h2>ขั้นตอนของ agent</h2><div class="panel" id="steps"></div></section>
  <section id="s-stream" class="hidden"><h2>คำตอบของโมเดล (กำลังสร้าง)</h2><pre class="stream" id="stream"></pre></section>
  <section id="s-verdict" class="hidden"><h2>ผลการตรวจ</h2><div class="panel" id="verdict"></div></section>
</main>

<script>
const EXAMPLES = [
  "ขี่มอไซค์ซ้อนแฟน ไม่ใส่หมวกทั้งคู่ แล้วฝ่าไฟแดง",
  "เมื่อคืนปาร์ตี้ หมดไปหลายขวด ตีสองขับกลับเอง",
  "ขับ 140 ทั้งที่ป้ายบอก 90 แล้วคุยโทรศัพท์ไปด้วย",
  "ใส่หมวกกันน็อคเรียบร้อย หยุดรอไฟแดงตามปกติ",
  "จอดรถในที่ห้ามจอดหน้าโรงพยาบาล",
];
const HINTS = {
  rag: "ค้นครั้งเดียวด้วยคำของผู้ใช้ → แหล่งข้อมูลที่คะแนนผ่านเกณฑ์ (min_score) ถูกใส่เป็นรายการมีหมายเลข → โมเดลตอบโดยอ้าง [n] ถ้าไม่มีอะไรผ่านเกณฑ์ ระบบปฏิเสธโดยไม่เรียกโมเดล",
  agent: "โมเดลเขียนคำค้นเป็นภาษากฎหมายเองและเรียกเครื่องมือค้นได้หลายรอบ แล้วโค้ดตรวจว่าทุกข้อหาที่ตอบมาจากผลค้นจริง",
  baseline: "ไม่มีการค้น: โมเดลเห็นแค่รายชื่อข้อหาในพรอมต์ ใช้เป็นตัวเทียบว่าการค้นช่วยหรือไม่",
};
const STATUS = { violations_found: "พบความผิด", no_violation: "ไม่ผิด", need_more_info: "ขอข้อมูลเพิ่ม", out_of_scope: "นอกขอบเขต" };
const $ = (id) => document.getElementById(id);
let mode = "rag";
let sources = [];

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const baht = (n) => n == null ? "ไม่ระบุ" : n.toLocaleString("th-TH") + " บาท";

for (const ex of EXAMPLES) {
  const b = document.createElement("button");
  b.textContent = ex;
  b.onclick = () => { $("story").value = ex; $("story").focus(); };
  $("examples").appendChild(b);
}
document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  $("modehint").textContent = HINTS[mode];
});
$("modehint").textContent = HINTS[mode];
$("story").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); });
$("go").onclick = run;

function show(id, on) { $(id).classList.toggle("hidden", !on); }

function renderSources(cited = new Set()) {
  if (!sources.length) {
    $("sources").innerHTML = '<div class="note" style="margin:0">ไม่มีแหล่งข้อมูลที่คะแนนผ่านเกณฑ์ (min_score)</div>';
    return;
  }
  $("sources").innerHTML = sources.map((s) => `
    <div class="src ${cited.has(s.offense_id) ? "cited" : ""}">
      <span class="n">[${s.n}]</span><span>${esc(s.description)}</span><span class="sc">BM25 ${s.score}</span>
      <span class="sub">${esc(s.section_label)}: ${esc(s.statute.slice(0, 160))}${s.statute.length > 160 ? "…" : ""}</span>
    </div>`).join("");
}

function renderVerdict(v) {
  const cited = new Set(v.violations.map((x) => x.offense_id));
  if (sources.length) renderSources(cited);
  const srcNo = (oid) => { const s = sources.find((x) => x.offense_id === oid); return s ? `[${s.n}] ` : ""; };
  let h = `<span class="badge b-${v.status}">${STATUS[v.status] || v.status}</span>`;
  h += `<div class="summary">${esc(v.summary_th)}</div>`;
  for (const x of v.violations) {
    const pen = [x.fine_max != null ? `ปรับไม่เกิน ${baht(x.fine_max)}` : "ไม่มีค่าปรับในตาราง",
                 x.jail_max_months ? `จำคุกไม่เกิน ${x.jail_max_months} เดือน` : "",
                 `ตัด ${x.points} คะแนน`].filter(Boolean).join("<br>");
    h += `<div class="viol"><div><div class="t">${srcNo(x.offense_id)}${esc(x.description)}</div>
          <div class="cite">${esc(x.citation_label)}</div></div><div class="pen">${pen}</div>
          <div class="why">${esc(x.reason)}</div></div>`;
  }
  if (v.follow_up_question) h += `<div class="ask">ถามเพิ่ม: ${esc(v.follow_up_question)}</div>`;
  const p = v.penalty;
  if (p) {
    h += `<div class="totals">
      <div class="tile"><div class="k">ค่าปรับสูงสุดรวม</div><div class="v">${baht(p.total_fine_max)}</div></div>
      <div class="tile"><div class="k">แต้มที่ถูกตัด${p.points_capped ? " (ถึงเพดาน 8)" : ""}</div><div class="v">${p.total_points}</div></div>
      <div class="tile"><div class="k">แต้มคงเหลือ (จาก 12)</div><div class="v">${p.points_left}</div></div>
    </div>`;
    if (p.any_jail) h += `<div class="note">มีข้อหาที่มีโทษจำคุกด้วย</div>`;
    if (p.license_suspension_risk) h += `<div class="note">แต้มหมด: เสี่ยงถูกพักใช้ใบอนุญาตขับขี่</div>`;
    h += `<div class="note">ตัวเลขเป็นเพดานสูงสุดที่กฎหมายกำหนด ค่าปรับจริงตามใบสั่งมักต่ำกว่านี้ · คำนวณด้วยโค้ดจากตาราง ไม่ได้ให้โมเดลคิดเลข</div>`;
  }
  const meta = [v.refused ? "ปฏิเสธเพราะไม่มีแหล่งข้อมูลผ่านเกณฑ์ (ไม่ได้เรียกโมเดล)" : "",
                v.llm_calls != null ? `${v.llm_calls} LLM call · ${v.seconds}s` : "",
                ...(v.notes || [])].filter(Boolean);
  if (meta.length) h += `<div class="note">${meta.map(esc).join(" · ")}</div>`;
  $("verdict").innerHTML = h;
  show("s-verdict", true);
}

function handle(ev) {
  if (ev.type === "sources") { sources = ev.sources; renderSources(); show("s-sources", true); }
  else if (ev.type === "token") { show("s-stream", true); $("stream").textContent += ev.text; $("stream").scrollTop = 1e9; }
  else if (ev.type === "step") {
    show("s-steps", true);
    const d = document.createElement("div");
    d.className = "step";
    d.innerHTML = `→ <code>${esc(ev.tool)}</code> ${esc(JSON.stringify(ev.args))}`;
    $("steps").appendChild(d);
  }
  else if (ev.type === "verdict") renderVerdict(ev);
  else if (ev.type === "error") { $("verdict").innerHTML = `<div class="err">${esc(ev.message)}</div>`; show("s-verdict", true); }
}

async function run() {
  const story = $("story").value.trim();
  if (!story) return;
  $("go").disabled = true;
  sources = [];
  ["sources", "steps", "verdict"].forEach((id) => $(id).innerHTML = "");
  $("stream").textContent = "";
  ["s-sources", "s-steps", "s-stream", "s-verdict"].forEach((id) => show(id, false));
  try {
    const resp = await fetch("/api/check", { method: "POST", headers: { "Content-Type": "application/json" },
                                             body: JSON.stringify({ story, mode }) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
    // SSE reader: network chunks do not line up with frames, so buffer and split on blank lines
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!frame.startsWith("data: ")) continue;
        const data = frame.slice(6);
        if (data === "[DONE]") continue;
        handle(JSON.parse(data));
      }
    }
    if (mode === "rag") show("s-stream", false);
  } catch (e) {
    handle({ type: "error", message: e.message });
  } finally {
    $("go").disabled = false;
  }
}
</script>
</body>
</html>
